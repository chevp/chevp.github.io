      "body": "[CTX] Context-Plan — Developer Tooling (cura-cli)\nfile: §13.0_developer-tooling-cli.ctx.md\nstatus: active · priority: medium\n\nStatus: ACTIVE — G1 PASSED 2026-04-29 (Context → Exploration)\nPhase: Exploration (G1 closed, vor G2)\nBezug: [tools/cura-cli/](../../tools/cura-cli/), [tools/cura-cli/SPEC.md](../../tools/cura-cli/SPEC.md), [tools/cura-cli/README.md](../../tools/cura-cli/README.md), [che-cli (Referenz, separater Repo)](../../../../tools/che-cli/), [CLAUDE.md (Cura-Projekt-Regeln)](../../CLAUDE.md)\n\n> Kontext-Anlass. Das bestehende [tools/cura-cli/](../../tools/cura-cli/) ist Bash-only (bin/cura Shebang #!/usr/bin/env bash, [install.sh](../../tools/cura-cli/install.sh) Unix-only). Auf Windows-PowerShell ist cura up nicht auffindbar — cura : Die Benennung \"cura\" wurde nicht als Name eines Cmdlet ... erkannt. Es gibt keinen install.ps1, kein cura.exe, keinen PATH-Eintrag im User-Environment. che-cli (Referenz-Tooling) hat dieses Problem mit install.ps1 für Windows-Bash-Brücke gelöst, ist aber selbst weiter Bash. cura-cli soll diesen Schritt überspringen und direkt nativ werden."

      "body": "[CTX] Problem Statement, Hypothesen, Risiken — Server-Driven UI\nfile: §14.1_problem-statement-server-driven-ui.ctx.md\nstatus: draft · priority: top\n\nStatus: DRAFT — TOP PRIO\nPhase: Context (vor G1)\nBezug: [§14.0 Context-Plan](§14.0_server-driven-ui.ctx.md), [§14.8 Context Inventory](§14.8_context-inventory.ctx.md), [ADR-013 SDUI](../decisions/ADR-013-server-driven-ui.md)\n\n> Revision 2026-05-02 (nach Code-Inspektion §14.8). Die ursprüngliche Aussage „Frontend spricht direkt mit Ollama\" wurde durch direkte Code-Inspektion widerlegt: ChatStreamService geht über core-service:8090/api/chat/stream, nicht direkt zu Ollama:11434. Direkte Ollama-Aufrufe existieren nur in den Dev-Tool-Pages (llm-lab, llm-runner, debug) — exakt die Memory-Ausnahmen. Das eigentliche Problem ist anders gelagert: core-service ist heute ein dummer Pass-Through-Proxy ohne Embabel-Orchestrierung. Die generische LLM-Antwort im Live-Mode kommt zustande, weil core-service Ollama ohne System-Prompt, ohne RAG, ohne Stage-Modell anspricht — nicht wegen Frontend-Bypass. §14er-Pläne bleiben in der Zielarchitektur richtig, der Akzent verschiebt sich: nicht „Bypass eliminieren\", sondern „core-service vom Proxy zum Orchestrator\"."
    },

      "body": "[PRD] Transformation nach chevp-ai-service Auslagerung\nfile: §4.2_transformation-chevp-ai-service.prd.md\nstatus: superseded\n\n> ⚠️ Zusätzlich SUPERSEDED am 2026-04-11 durch [§4.9](§4.9_backend-rename-and-ai-tooling.prd.md).\n>\n> §4.2 ging davon aus, dass chevp-ai-service als produktiver LLM-Pipeline-\n> Service neben cura-api läuft. Diese Architektur gilt nicht mehr:\n> chevp-ai-service ist nur Dev-Test-Bridge, die LLM-Pipeline wandert\n> nach cura-server-ai (in-process, mit quarkus-langchain4j und\n> Tool-Use). Siehe §4.9 für die neue Architektur.\n\nBezug: §6.2 (abgelöst), ADR-002 (verfeinert), [ADR-004](../../decisions/ADR-004-datenbank-mariadb-jwt-auth.md), [§2.4.1](§2.4.1_hybrid-firebase-auth-mariadb-data.ctx.md), [§4.9](§4.9_backend-rename-and-ai-tooling.prd.md)\nZiel: Cura-Repo bereinigen nach Auslagerung der KI-Pipeline in separates chevp-ai-service PHP-Repo. Business-Logic in cura-api (PHP auf Cyon), Prompts in Firestore, Frontend als Thin Client.\nStatus: SUPERSEDED (2026-04-05 — Daten-Layer durch ADR-004/§2.4.1 ersetzt; 2026-04-11 — AI-Pipeline-Architektur durch §4.9 ersetzt.)"

      "body": "[CTX] chevp-ai-service Integrations-Vertrag & Error-Handling\nfile: §4.4_chevp-ai-service-integration-contract.ctx.md\nstatus: superseded\n\n> ⚠️ SUPERSEDED am 2026-04-11 durch [§4.9](§4.9_backend-rename-and-ai-tooling.prd.md).\n>\n> §4.4 spezifiziert einen Integrations-Vertrag zwischen cura-api (Quarkus)\n> und chevp-ai-service als produktivem LLM-Caller. Diese Annahme ist\n> ungültig: chevp-ai-service ist nur eine Dev-Test-Bridge, der LLM-Call\n> läuft direkt aus cura-server-ai (siehe §4.9). Ein externer\n> Integrations-Vertrag ist damit obsolet — die LLM-Integration läuft\n> in-process via quarkus-langchain4j gegen Anthropic.\n\nStatus: SUPERSEDED (2026-04-11 — siehe §4.9)\nDatum: 2026-04-05\nBezug: [§4.2](§4.2_transformation-chevp-ai-service.prd.md), [ADR-002](../../decisions/ADR-002-server-seitige-ki.md), [§5.1](§5.1_dynamic-report-migration.prd.md), [§4.5](§4.5_api-error-format.ctx.md)\nKontext: cura-api ruft AI-Funktionen extern via chevp-ai-service (eigenes PHP-Repo, tenant-unaware). AiGatewayService ist skelettiert, aber Vertrag (Endpoints, Payloads, Streaming, Retries, Timeouts) ist nicht spezifiziert. Ohne stabilen Contract blockiert jeder AI-Feature (Chat, Report-Generation, Extraktion)."
    },

      "version": 1,
      "gates_passed": [],
      "body": "[CTX] Threat Model — Bedrohungsanalyse (STRIDE)\nfile: §7.0_threat-model.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-08)\nDatum: 2026-04-08\nBezug: [§7.1](§7.1_multi-tenancy-security-isolation.ctx.md), [§7.2](§7.2_nlpd-compliance-audit-log.ctx.md), [§7.3](§7.3_ablagesystem-sicherheitsarchitektur.ctx.md), [§7.4](§7.4_feld-und-dateiverschluesselung.ctx.md), [§7.5](§7.5_rbac-und-freigaben.ctx.md), [§7.6](§7.6_dsr-retention-und-loeschkonzept.ctx.md), [§8.4](§8.4_offline-security-mobile-web.ctx.md), [§9.2](§9.2_security-and-privacy-tests.prd.md)\nKontext: Cura verarbeitet besonders schützenswerte Personendaten (nLPD Art. 5 lit. c: Gesundheitsdaten, Sozialhilfe-Massnahmen) von vulnerablen Personen in Schweizer Sozialinstitutionen. Die §7.x-Pläne definieren Schutzmassnahmen, aber ohne systematische Bedrohungsanalyse fehlt die Grundlage, ob die Massnahmen die richtigen Risiken adressieren. Dieses Threat Model dient als Basis für alle Security-Pläne."
    },
    {
      "id": "§7.10",
      "type": "decision",
      "state": "context",
      "title": "Production-Env-Hardening (APP_DEBUG, CORS, Secrets)",
      "created": "2026-04-13",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] Production-Env-Hardening (APP_DEBUG, CORS, Secrets)\nfile: §7.10_production-env-hardening.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-13)\nDatum: 2026-04-13\nBezug: [§6.2](§6.2_php-server-firebase-ki.prd.md), [§7.0](§7.0_threat-model.ctx.md), [§7.7](§7.7_cors-credentials-origin-scoping.ctx.md)\nKontext: Security-Audit 2026-04-13. backend/cura-api/.env.example setzt APP_DEBUG=true als Default. Handler.php emittiert bei APP_DEBUG=true Exception-Klasse, Message und File:Line in den Response-Body — auf Produktion ein Info-Leak ersten Grades (Pfade, Stacktraces, Library-Versionen). Die FTP-Deployment-Pipeline exkludiert .env korrekt, aber es gibt keine Validierung, dass die auf Cyon manuell hinterlegte .env die richtigen Werte hat. Fehlt z.B. CORS_ALLOWED_ORIGINS, fällt der Code auf einen leeren Default zurück, und die ohnehin fragile CORS-Middleware (§7.7) wird angreifbarer. Ein Self-Check-Endpoint und ein Deploy-Smoke-Test müssen diese Werte zur Laufzeit bestätigen."
    },
    {
      "id": "§7.11",
      "type": "decision",
      "state": "context",
      "title": ".htpasswd-Verfügbarkeit überwachen (Basic-Auth-Fallback)",
      "created": "2026-04-13",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] .htpasswd-Verfügbarkeit überwachen (Basic-Auth-Fallback)\nfile: §7.11_htpasswd-availability-monitoring.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-13)\nDatum: 2026-04-13\nBezug: [§6.12](§6.12_mycyon-static-showcase-deploy.ctx.md), [§7.0](§7.0_threat-model.ctx.md), [§6.3](§6.3_monitoring-logging-health.ctx.md)\nKontext: Security-Audit 2026-04-13. Die Root-.htaccess (deployment/cyon/.htaccess) schützt cura.sowuvuma.cyon.site/* via Basic Auth:\n\ncurl -I gegen eine Unterroute liefert aktuell korrekt HTTP/2 401. Aber: der AuthUserFile-Pfad ist hart kodiert und liegt ausserhalb des deployten Verzeichnisses — d.h. kein Deploy-Prozess kontrolliert die Datei. Wird sie versehentlich gelöscht, umbenannt, in den Permissions kaputt gemacht oder von Cyon-Support verschoben, liefert Apache je nach Version entweder 500 (erkennbar) oder ignoriert den <Require>-Block still → die gesamte Site wird öffentlich zugänglich. Schlimmster Fall ist, dass es niemand merkt, weil Alerts fehlen."
    },
    {
      "id": "§7.1",
      "type": "decision",
      "state": "context",
      "title": "Multi-Tenancy Security & Isolations-Tests",
      "created": "2026-04-05",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] Multi-Tenancy Security & Isolations-Tests\nfile: §7.1_multi-tenancy-security-isolation.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-05)\nDatum: 2026-04-05\nBezug: [§7.0](§7.0_threat-model.ctx.md), [ADR-004](../../decisions/ADR-004-datenbank-mariadb-jwt-auth.md), [§2.4.1](§2.4.1_hybrid-firebase-auth-mariadb-data.ctx.md), [§4.5](§4.5_api-error-format.ctx.md), [§9.1](§9.1_testing-strategy.prd.md)\nKontext: Cura ist Multi-Tenant. Ein Datenleck zwischen Tenants (Sozialinstitutionen) wäre ein kritischer Vorfall. documents.tenant_id trennt Daten logisch, aber ohne systematische Isolations-Tests bleibt das Risiko hoch.\n\n---\n\n## 1. Ziel"
    },
    {
      "id": "§7.2",
      "type": "decision",

      "title": "nLPD/DSGVO-Compliance & Audit-Logging",

      "gates_passed": [],
      "body": "[CTX] nLPD/DSGVO-Compliance & Audit-Logging\nfile: §7.2_nlpd-compliance-audit-log.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-05)\nDatum: 2026-04-05\nBezug: [§7.0](§7.0_threat-model.ctx.md), [§7.1](§7.1_multi-tenancy-security-isolation.ctx.md), [ADR-002](../../decisions/ADR-002-server-seitige-ki.md), [§2.5](§2.5_database-migrations-phinx.ctx.md), [§7.3](§7.3_ablagesystem-sicherheitsarchitektur.ctx.md), [§7.4](§7.4_feld-und-dateiverschluesselung.ctx.md), [§7.5](§7.5_rbac-und-freigaben.ctx.md), [§7.6](§7.6_dsr-retention-und-loeschkonzept.ctx.md), [§9.2](§9.2_security-and-privacy-tests.prd.md)\nKontext: Cura verarbeitet besonders schützenswerte Personendaten (Gesundheitsdaten, Sozialleistungen, IBB-Indikatoren) von Menschen in Schweizer Sozialinstitutionen. Die Schweizer nLPD (revidiertes Datenschutzgesetz, in Kraft seit 01.09.2023) und DSGVO (bei EU-Betroffenen) verlangen Audit-Trails, Betroffenenrechte, Datenminimierung und DSFA."
    },
    {
      "id": "§7.3",
      "type": "decision",
      "state": "context",
      "title": "Ablagesystem-Sicherheitsarchitektur",
      "created": "2026-04-06",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] Ablagesystem-Sicherheitsarchitektur\nfile: §7.3_ablagesystem-sicherheitsarchitektur.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-06)\nDatum: 2026-04-06\nBezug: [§7.1](§7.1_multi-tenancy-security-isolation.ctx.md), [§7.2](§7.2_nlpd-compliance-audit-log.ctx.md), [§7.4](§7.4_feld-und-dateiverschluesselung.ctx.md), [§7.5](§7.5_rbac-und-freigaben.ctx.md), [PROMPT-120](../../prompts/runtime/PROMPT-120-Dateisystem-basierte-Ablage-mit-Baumstruktur-und-Ordnererstellung.md)\nKontext: Cura benötigt ein Ablagesystem für Dokumente, Fotos, Berichte und Formulare. Diese Dateien enthalten besonders schützenswerte Personendaten (Gesundheitsdaten, Sozialberichte). Ein unkontrolliertes Dateisystem-Modell mit Klartext-Pfaden birgt erhebliche Risiken: Path-Traversal, unautorisierter Zugriff, fehlende Nachvollziehbarkeit."
    },
    {
      "id": "§7.4",
      "type": "decision",
      "state": "context",
      "title": "Feld- und Dateiverschlüsselung",
      "created": "2026-04-06",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] Feld- und Dateiverschlüsselung\nfile: §7.4_feld-und-dateiverschluesselung.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-06)\nDatum: 2026-04-06\nBezug: [§7.2](§7.2_nlpd-compliance-audit-log.ctx.md), [§7.3](§7.3_ablagesystem-sicherheitsarchitektur.ctx.md)\nKontext: Cura speichert besonders schützenswerte Personendaten (Diagnosen, AHV-Nummern, Sozialberichte) als Plain JSON in documents.data. Weder Felder noch hochgeladene Dateien werden verschlüsselt. Bei Datenbank-Kompromittierung oder Backup-Diebstahl liegen alle Daten im Klartext vor. §7.2 definiert Feldverschlüsselung als offenes Akzeptanzkriterium.\n\n---\n\n## 1. Ziel"
    },
    {
      "id": "§7.5",
      "type": "decision",
      "state": "context",
      "title": "RBAC & Freigaben (serverseitig)",
      "created": "2026-04-06",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] RBAC & Freigaben (serverseitig)\nfile: §7.5_rbac-und-freigaben.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-06)\nDatum: 2026-04-06\nBezug: [§7.1](§7.1_multi-tenancy-security-isolation.ctx.md), [§7.2](§7.2_nlpd-compliance-audit-log.ctx.md), [§7.3](§7.3_ablagesystem-sicherheitsarchitektur.ctx.md)\nKontext: Cura hat drei Rollen (pflege, admin, leitung), aber Rollenprüfung findet aktuell nur im Frontend statt (role.guard.ts). Im Backend extrahiert AuthMiddleware die Rolle und speichert sie in Request::attributes, aber kein Controller erzwingt sie. TenantContext::isSuperAdmin() existiert, wird aber nie aufgerufen. Für ein datenschutzkritisches System reicht Frontend-RBAC nicht — ein manipulierter Request umgeht es."
    },
    {
      "id": "§7.6",
      "type": "decision",
      "state": "context",
      "title": "DSR, Retention & Löschkonzept",
      "created": "2026-04-06",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] DSR, Retention & Löschkonzept\nfile: §7.6_dsr-retention-und-loeschkonzept.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-06)\nDatum: 2026-04-06\nBezug: [§7.2](§7.2_nlpd-compliance-audit-log.ctx.md), [§7.3](§7.3_ablagesystem-sicherheitsarchitektur.ctx.md), [§7.4](§7.4_feld-und-dateiverschluesselung.ctx.md), [§7.5](§7.5_rbac-und-freigaben.ctx.md)\nKontext: nLPD Art. 25 (Auskunft), Art. 32 (Löschung/Berichtigung) und DSGVO Art. 15–17 verpflichten zur Umsetzung von Data-Subject-Rights. §7.2 definiert DSR-Endpoints als offenes Akzeptanzkriterium. Im Code existieren weder Export- noch Erase-Endpoints. Soft-Delete ist implementiert, aber ohne automatisierten Hard-Delete-Job oder Anonymisierungslogik."
    },
    {
      "id": "§7.7",
      "type": "decision",
      "state": "context",
      "title": "CORS: Allow-Credentials auf Origin-Check einschränken",
      "created": "2026-04-13",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] CORS: Allow-Credentials auf Origin-Check einschränken\nfile: §7.7_cors-credentials-origin-scoping.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-13)\nDatum: 2026-04-13\nBezug: [§7.0](§7.0_threat-model.ctx.md), [§6.2](§6.2_php-server-firebase-ki.prd.md)\nKontext: Security-Audit 2026-04-13 (cura.sowuvuma.cyon.site). CorsMiddleware setzt Access-Control-Allow-Credentials: true bedingungslos auf jede Response, auch wenn der Origin nicht in CORS_ALLOWED_ORIGINS enthalten ist. Aktuell harmlos, weil Access-Control-Allow-Origin nur bei Match gesetzt wird und Browser die Credentials ohne passenden Origin-Header nicht akzeptieren. Wird CORS_ALLOWED_ORIGINS jedoch jemals versehentlich auf * oder leer gesetzt, leakt Credentials-Handling sofort — die Middleware soll defense-in-depth sein, nicht auf Browser-Verhalten vertrauen."
    },

      "version": 1,
      "gates_passed": [],
      "body": "[CTX] Health-Endpunkte: Information Disclosure reduzieren\nfile: §7.8_health-endpoint-info-disclosure.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-13)\nDatum: 2026-04-13\nBezug: [§6.3](§6.3_monitoring-logging-health.ctx.md), [§7.0](§7.0_threat-model.ctx.md)\nKontext: Security-Audit 2026-04-13. GET /api/health/ready liefert aktuell service, version (aus APP_VERSION), DB-Status und AI-Service-URL mit Latenz-Details. Heute per Apache-Basic-Auth geschützt (Require valid-user), aber sobald die Route für externes Uptime-Monitoring ausgenommen wird (siehe §6.3), werden diese Details öffentlich. Version-Strings sind Recon-Material für CVE-gezielte Angriffe; interne Service-URLs leaken Netzwerk-Topologie. Liveness und Readiness müssen minimal sein — Details gehören in einen separaten, auth-pflichtigen /health/deep."
    },
    {
      "id": "§7.9",
      "type": "decision",
      "state": "context",
      "title": "Row-Level Ownership-Authorization für Records & Residents",
      "created": "2026-04-13",
      "version": 1,
      "gates_passed": [],
      "body": "[CTX] Row-Level Ownership-Authorization für Records & Residents\nfile: §7.9_row-level-ownership-authorization.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-13)\nDatum: 2026-04-13\nBezug: [§7.1](§7.1_multi-tenancy-security-isolation.ctx.md), [§7.5](§7.5_rbac-und-freigaben.ctx.md), [§7.0](§7.0_threat-model.ctx.md), [§9.2](§9.2_security-and-privacy-tests.prd.md)\nKontext: Security-Audit 2026-04-13. RecordController und ResidentController erzwingen via DocumentRepository die Tenant-Isolation (tenant_id in WHERE), aber keine Row-Level-Checks innerhalb des Tenants. Jeder authentifizierte Benutzer mit Rolle pflege kann damit:\n\n- alle Residents und Records des Tenants auflisten (GET),\n- beliebige Records und Residents editieren (PUT/PATCH), unabhängig von created_by oder Zuweisung,\n- beliebige Records löschen (DELETE)."
    },
    {
      "id": "§8.1",
      "type": "spec",
      "state": "context",
      "title": "Mobile-App Architektur (Capacitor Android/iOS)",
      "created": "2026-04-05",
      "version": 1,
      "gates_passed": [],
      "body": "[PRD] Mobile-App Architektur (Capacitor Android/iOS)\nfile: §8.1_mobile-capacitor-architecture.prd.md\nstatus: backlog · priority: P2\n\nStatus: IN ARBEIT (2026-04-06)\nDatum: 2026-04-05\nBezug: [§3.3](§3.3_angular-routing-state-forms.prd.md), [§3.4](§3.4_uxp-020-angular-port.prd.md), [§8.3](§8.3_offline-sync-strategy.ctx.md)\nKontext: mobile/android/ und mobile/ios/ sind aktuell leere Platzhalter. Pflegekräfte auf Schicht benötigen Smartphone-/Tablet-Zugriff, teils in WLAN-schwachen Zonen (Wohngruppen, Ausflüge). Capacitor erlaubt Wiederverwendung von cura-app Angular-Code → minimaler Mehraufwand.\n\n---\n\n## 1. Ziel"

      "body": "[CTX] Offline-Security (Mobile + Web)\nfile: §8.4_offline-security-mobile-web.ctx.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-06)\nDatum: 2026-04-06\nBezug: [§8.1](§8.1_mobile-capacitor-architecture.prd.md), [§8.3](§8.3_offline-sync-strategy.ctx.md), [§7.4](§7.4_feld-und-dateiverschluesselung.ctx.md)\nKontext: §8.3 definiert Offline-Sync für Residents, Records, Medikation und Fotos via IndexedDB. Aktuell speichert offline-db.ts alle Daten unverschlüsselt in IndexedDB (cachePut schreibt payload direkt). Auf Shared Devices, verlorenen Geräten oder bei physischem Zugriff sind Gesundheits- und Sozialdaten im Klartext einsehbar (Browser DevTools, Disk-Extraction).\n\n---\n\n## 1. Ziel"

      "body": "[PRD] Test-Strategie — Unit, Integration, E2E, Visual\nfile: §9.1_testing-strategy.prd.md\nstatus: in-progress · priority: P2\n\nStatus: IN ARBEIT (2026-04-12)\nDatum: 2026-04-05\nBezug: [§5.2](§5.2_cicd-pipeline.prd.md), [§3.4](§3.4_uxp-020-angular-port.prd.md), [§3.6](§3.6_accessibility-wcag-aa.prd.md), [§7.1](§7.1_multi-tenancy-security-isolation.ctx.md), [§9.2](§9.2_security-and-privacy-tests.prd.md)\nKontext: Weder cura-server noch cura-app haben nennenswerte Tests. PHPUnit + Jasmine sind konfiguriert, aber leer. Für Produktions-Reife mit Sozial-Daten ist eine abgestufte Test-Pyramide Pflicht.\n\n---\n\n## 1. Ziel"

      "id": "§9.2",

      "body": "[PRD] Security & Privacy Tests\nfile: §9.2_security-and-privacy-tests.prd.md\nstatus: backlog · priority: P2\n\nStatus: OFFEN (2026-04-06)\nDatum: 2026-04-06\nBezug: [§9.1](§9.1_testing-strategy.prd.md), [§7.1](§7.1_multi-tenancy-security-isolation.ctx.md), [§7.2](§7.2_nlpd-compliance-audit-log.ctx.md), [§7.3](§7.3_ablagesystem-sicherheitsarchitektur.ctx.md), [§7.4](§7.4_feld-und-dateiverschluesselung.ctx.md), [§7.5](§7.5_rbac-und-freigaben.ctx.md), [§7.6](§7.6_dsr-retention-und-loeschkonzept.ctx.md), [§8.4](§8.4_offline-security-mobile-web.ctx.md)\nKontext: §9.1 definiert die allgemeine Teststrategie. Die Security- und Datenschutz-spezifischen Tests sind dort nur als \"OWASP ZAP Baseline\" erwähnt. Für ein System mit besonders schützenswerten Daten braucht es eine dedizierte Security-Test-Suite, die Cross-Tenant-Isolation, RBAC, Verschlüsselung, DSR und Offline-Sicherheit systematisch prüft."

<script>
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const STATES = {
    context:     { color: css('--state-context'),     label: "Backlog/Draft" },
    exploration: { color: css('--state-exploration'), label: "Active" },
    production:  { color: css('--state-production'),  label: "Finished" },
    superseded:  { color: css('--state-superseded'),  label: "Deprecated/Superseded" },
    invalidated: { color: css('--state-invalidated'), label: "Archived" },
  };
  const TYPE_SHAPE = {
    spec:        'rect',      // PRD
    decision:    'hexagon',   // CTX
    hypothesis:  'diamond',   // EXP
  };
  const TYPE_LABEL = { spec: 'PRD', decision: 'CTX', hypothesis: 'EXP' };
  const EDGE_STYLE = {
    depends_on:        { color: css('--edge-depends_on'),        dash: null,    width: 1.5 },
    refines:           { color: css('--edge-refines'),           dash: null,    width: 2 },
    supersedes:        { color: css('--edge-supersedes'),        dash: null,    width: 3 },
    contradicts:       { color: css('--edge-contradicts'),       dash: '6 4',   width: 2 },
    related_to:        { color: css('--edge-related_to'),        dash: '2 4',   width: 1 },
    produced_by:       { color: css('--edge-produced_by'),       dash: '1 3',   width: 1 },
    evidence_for:      { color: css('--edge-evidence_for'),      dash: null,    width: 2 },
    evidence_against:  { color: css('--edge-evidence_against'),  dash: null,    width: 2 },
  };

  const raw = JSON.parse(document.getElementById('graph-data').textContent);
  const nodeMap = Object.fromEntries(raw.nodes.map(n => [n.id, n]));
  const NODE_R = 20;

  // group nodes by chapter (§N) so the layout has visual clusters
  function chapterOf(id) {
    const m = id.match(/§(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  }
  const chapters = [...new Set(raw.nodes.map(n => chapterOf(n.id)))].sort((a,b) => a-b);
  const chapterAngle = Object.fromEntries(
    chapters.map((c, i) => [c, (i / chapters.length) * Math.PI * 2])
  );

  raw.nodes.forEach((n, i) => {
    const a = chapterAngle[chapterOf(n.id)] + (Math.random() - 0.5) * 0.4;
    const r = 350 + Math.random() * 150;
    n.x = Math.cos(a) * r;
    n.y = Math.sin(a) * r;
    n.vx = 0; n.vy = 0;
    n.fixed = false;
    n.hidden = false;
  });

  const defs = document.getElementById('defs');
  const usedColors = new Set(Object.values(EDGE_STYLE).map(s => s.color));
  for (const c of usedColors) {
    const id = 'arrow_' + c.replace('#','');
    defs.insertAdjacentHTML('beforeend', `
      <marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="${c}"/>
      </marker>`);
  }
  const arrowFor = c => 'arrow_' + c.replace('#','');

  const svg = document.getElementById('svg');
  const viewport = document.getElementById('viewport');
  const edgeLayer = document.getElementById('edges');
  const edgeLabelLayer = document.getElementById('edgeLabels');
  const nodeLayer = document.getElementById('nodes');
  const SVGNS = 'http://www.w3.org/2000/svg';

  function shapePath(shape, r) {
    switch (shape) {
      case 'rect':         return `M ${-r} ${-r*0.7} h ${2*r} v ${1.4*r} h ${-2*r} z`;
      case 'diamond':      return `M 0 ${-r} L ${r} 0 L 0 ${r} L ${-r} 0 z`;
      case 'hexagon':      {
        const pts = [];
        for (let k = 0; k < 6; k++) {
          const a = Math.PI/6 + k * Math.PI/3;
          pts.push(`${(k===0?'M':'L')} ${Math.cos(a)*r} ${Math.sin(a)*r}`);
        }
        return pts.join(' ') + ' z';
      }
      default: return null;
    }
  }

  raw.edges.forEach(e => {
    const style = EDGE_STYLE[e.type] ?? { color: '#888', dash: null, width: 1 };
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('class', 'edge');
    path.setAttribute('stroke', style.color);
    path.setAttribute('stroke-width', style.width);
    if (style.dash) path.setAttribute('stroke-dasharray', style.dash);
    path.setAttribute('marker-end', `url(#${arrowFor(style.color)})`);
    edgeLayer.appendChild(path);

    const label = document.createElementNS(SVGNS, 'text');
    label.setAttribute('class', 'edge-label');
    label.textContent = e.type;
    edgeLabelLayer.appendChild(label);

    e._el = path;
    e._label = label;
    e._style = style;
  });

  raw.nodes.forEach(n => {
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'node-group');
    g.dataset.id = n.id;

    const stateColor = STATES[n.state]?.color ?? '#888';
    const isFinal = n.state === 'superseded' || n.state === 'invalidated';
    const shape = TYPE_SHAPE[n.type] ?? 'rect';

    let shapeEl;
    const path = shapePath(shape, NODE_R);
    if (path) {
      shapeEl = document.createElementNS(SVGNS, 'path');
      shapeEl.setAttribute('d', path);
    } else {
      shapeEl = document.createElementNS(SVGNS, 'circle');
      shapeEl.setAttribute('r', NODE_R);
    }
    shapeEl.setAttribute('class', 'shape');
    shapeEl.setAttribute('fill', stateColor);
    shapeEl.setAttribute('stroke', isFinal ? css('--bg') : stateColor);
    shapeEl.setAttribute('stroke-width', '1.5');
    if (isFinal) shapeEl.setAttribute('stroke-dasharray', '4 3');

    const idText = document.createElementNS(SVGNS, 'text');
    idText.setAttribute('class', 'label');
    idText.setAttribute('text-anchor', 'middle');
    idText.setAttribute('dominant-baseline', 'central');
    idText.setAttribute('y', '0');
    idText.style.fontWeight = '600';
    idText.style.fontSize = '9.5px';
    idText.textContent = n.id;

    const titleText = document.createElementNS(SVGNS, 'text');
    titleText.setAttribute('class', 'label outside');
    titleText.setAttribute('text-anchor', 'middle');
    titleText.setAttribute('y', NODE_R + 12);
    titleText.textContent = n.title.length > 32 ? n.title.slice(0, 30) + '…' : n.title;

    g.appendChild(shapeEl);
    g.appendChild(idText);
    g.appendChild(titleText);
    nodeLayer.appendChild(g);

    n._el = g;
    n._shape = shapeEl;
    n._title = titleText;
  });

  const REPULSION = 8000;
  const SPRING_LENGTH = 110;
  const SPRING_K = 0.05;
  const CENTER_K = 0.0015;
  const DAMPING = 0.82;
  let temperature = 1.0;

  function tick() {
    const live = raw.nodes.filter(n => !n.hidden);
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx*dx + dy*dy;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const d = Math.sqrt(d2);
        const f = REPULSION / d2;
        const fx = f * dx / d, fy = f * dy / d;
        a.vx -= fx; a.vy -= fy;
        b.vx += fx; b.vy += fy;
      }
    }
    for (const e of raw.edges) {
      const a = nodeMap[e.from], b = nodeMap[e.to];
      if (!a || !b || a.hidden || b.hidden) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = (d - SPRING_LENGTH) * SPRING_K;
      const fx = f * dx / d, fy = f * dy / d;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
    for (const n of live) {
      n.vx -= n.x * CENTER_K;
      n.vy -= n.y * CENTER_K;
    }
    for (const n of live) {
      if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
      n.vx *= DAMPING; n.vy *= DAMPING;
      n.x += n.vx * temperature;
      n.y += n.vy * temperature;
    }
    temperature = Math.max(0.05, temperature * 0.998);
  }

  function render() {
    for (const n of raw.nodes) {
      n._el.setAttribute('transform', `translate(${n.x},${n.y})`);
      n._el.style.display = n.hidden ? 'none' : '';
    }
    for (const e of raw.edges) {
      const a = nodeMap[e.from], b = nodeMap[e.to];
      if (!a || !b) { e._el.style.display = 'none'; e._label.style.display = 'none'; continue; }
      const hide = a.hidden || b.hidden;
      e._el.style.display = hide ? 'none' : '';
      e._label.style.display = hide ? 'none' : '';
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const ux = dx/d, uy = dy/d;
      const sx = a.x + ux * NODE_R, sy = a.y + uy * NODE_R;
      const ex = b.x - ux * (NODE_R + 4), ey = b.y - uy * (NODE_R + 4);
      e._el.setAttribute('d', `M ${sx} ${sy} L ${ex} ${ey}`);
      e._label.setAttribute('x', (sx + ex) / 2);
      e._label.setAttribute('y', (sy + ey) / 2 - 3);
    }
  }

  function loop() { tick(); render(); requestAnimationFrame(loop); }
  loop();

  let panX = 0, panY = 0, scale = 0.7;
  function applyView() {
    const rect = svg.getBoundingClientRect();
    viewport.setAttribute('transform',
      `translate(${rect.width/2 + panX},${rect.height/2 + panY}) scale(${scale})`);
  }
  applyView();
  window.addEventListener('resize', applyView);

  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const delta = -ev.deltaY * 0.001;
    scale = Math.min(3, Math.max(0.15, scale * (1 + delta)));
    applyView();
  }, { passive: false });

  let panning = null;
  svg.addEventListener('mousedown', ev => {
    if (ev.target.closest('.node-group')) return;
    panning = { x: ev.clientX, y: ev.clientY, px: panX, py: panY };
    svg.classList.add('dragging');
  });
  window.addEventListener('mousemove', ev => {
    if (!panning) return;
    panX = panning.px + (ev.clientX - panning.x);
    panY = panning.py + (ev.clientY - panning.y);
    applyView();
  });
  window.addEventListener('mouseup', () => { panning = null; svg.classList.remove('dragging'); });

  function clientToWorld(cx, cy) {
    const rect = svg.getBoundingClientRect();
    return {
      x: (cx - rect.left - rect.width/2 - panX) / scale,
      y: (cy - rect.top - rect.height/2 - panY) / scale,
    };
  }
  let dragging = null;
  nodeLayer.addEventListener('mousedown', ev => {
    const g = ev.target.closest('.node-group');
    if (!g) return;
    ev.stopPropagation();
    const n = nodeMap[g.dataset.id];
    n.fixed = true;
    dragging = { node: n };
    temperature = Math.max(temperature, 0.5);
  });
  window.addEventListener('mousemove', ev => {
    if (!dragging) return;
    const p = clientToWorld(ev.clientX, ev.clientY);
    dragging.node.x = p.x; dragging.node.y = p.y;
    dragging.node.vx = 0; dragging.node.vy = 0;
  });
  window.addEventListener('mouseup', () => {
    if (dragging) { dragging.node.fixed = false; dragging = null; }
  });

  let selectedId = null;
  nodeLayer.addEventListener('click', ev => {
    const g = ev.target.closest('.node-group');
    if (!g) return;
    selectNode(g.dataset.id);
  });
  svg.addEventListener('click', ev => {
    if (!ev.target.closest('.node-group')) selectNode(null);
  });

  function selectNode(id) {
    selectedId = id;
    const neighbours = new Set();
    if (id) {
      neighbours.add(id);
      for (const e of raw.edges) {
        if (e.from === id) neighbours.add(e.to);
        if (e.to === id) neighbours.add(e.from);
      }
    }
    for (const n of raw.nodes) {
      n._el.classList.toggle('selected', n.id === id);
      n._el.classList.toggle('dim', !!id && !neighbours.has(n.id));
    }
    for (const e of raw.edges) {
      const incident = id && (e.from === id || e.to === id);
      e._el.classList.toggle('dim', !!id && !incident);
      e._label.classList.toggle('dim', !!id && !incident);
    }
    renderDetails(id);
  }

  const details = document.getElementById('details');
  function renderDetails(id) {
    if (!id) {
      details.innerHTML = `<h2>Details</h2><p class="empty">Knoten anklicken, um Inhalte zu sehen.</p>`;
      return;
    }
    const n = nodeMap[id];
    if (!n) return;
    const outgoing = raw.edges.filter(e => e.from === id);
    const incoming = raw.edges.filter(e => e.to === id);
    details.innerHTML = `
      <h2>Knoten</h2>
      <p class="node-title">${esc(n.title)}</p>
      <div class="meta">
        <b>${esc(n.id)}</b> · ${esc(TYPE_LABEL[n.type] || n.type)} ·
        <span style="color:${STATES[n.state]?.color}">${esc(STATES[n.state]?.label || n.state)}</span>
        <br><span>created: ${esc(n.created || '—')}</span>
      </div>
      <div class="body">${esc(n.body || '')}</div>
      <div class="edges">
        <h2>Kanten</h2>
        ${edgeList('ausgehend (zeigt auf)', outgoing, 'to')}
        ${edgeList('eingehend (wird referenziert)', incoming, 'from')}
      </div>
    `;
  }
  function edgeList(label, list, otherKey) {
    if (!list.length) return `<div class="meta">${label}: —</div>`;
    return `
      <div class="meta">${label}:</div>
      <ul>${list.map(e =>
        `<li><b>${esc(e.type)}</b> → ${esc(e[otherKey])}${e.note ? ` <span>(${esc(e.note)})</span>` : ''}</li>`
      ).join('')}</ul>`;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ----- Filters -----
  const stateFilterRoot = document.getElementById('state-filters');
  const activeStates = new Set(Object.keys(STATES));
  for (const [key, meta] of Object.entries(STATES)) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.setAttribute('aria-pressed', 'true');
    chip.dataset.state = key;
    chip.innerHTML = `<span class="dot" style="background:${meta.color}"></span>${meta.label}`;
    chip.onclick = () => {
      if (activeStates.has(key)) activeStates.delete(key); else activeStates.add(key);
      chip.setAttribute('aria-pressed', activeStates.has(key) ? 'true' : 'false');
      applyFilter();
    };
    stateFilterRoot.appendChild(chip);
  }
  const typeFilterRoot = document.getElementById('type-filters');
  const activeTypes = new Set(Object.keys(TYPE_SHAPE));
  for (const [key, _shape] of Object.entries(TYPE_SHAPE)) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.setAttribute('aria-pressed', 'true');
    chip.dataset.t = key;
    chip.textContent = TYPE_LABEL[key] || key;
    chip.onclick = () => {
      if (activeTypes.has(key)) activeTypes.delete(key); else activeTypes.add(key);
      chip.setAttribute('aria-pressed', activeTypes.has(key) ? 'true' : 'false');
      applyFilter();
    };
    typeFilterRoot.appendChild(chip);
  }
  const searchInput = document.getElementById('search');
  let searchQuery = '';
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    applyFilter();
  });
  function applyFilter() {
    for (const n of raw.nodes) {
      const stateOk = activeStates.has(n.state);
      const typeOk = activeTypes.has(n.type);
      const searchOk = !searchQuery
        || n.id.toLowerCase().includes(searchQuery)
        || n.title.toLowerCase().includes(searchQuery);
      n.hidden = !(stateOk && typeOk && searchOk);
    }
    temperature = Math.max(temperature, 0.5);
  }

  const legend = document.getElementById('legend');
  const edgeLegend = Object.entries(EDGE_STYLE)
    .filter(([k]) => raw.edges.some(e => e.type === k))
    .map(([k, s]) =>
      `<span class="group"><span class="edge-swatch" style="border-top-color:${s.color};border-top-style:${s.dash ? 'dashed' : 'solid'}"></span>${k}</span>`
    ).join('');
  legend.innerHTML = edgeLegend;
</script>
</body>
</html>
